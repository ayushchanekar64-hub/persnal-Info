<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mindBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E24" />
      <stop offset="50%" stop-color="#16343D" />
      <stop offset="100%" stop-color="#10252D" />
    </linearGradient>

    <!-- Neural Glow Gradient -->
    <linearGradient id="mindNeuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="neuralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="256" height="256" rx="56" fill="url(#mindBgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

  <!-- Outer Neural Ring Halo -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#mindNeuralGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Stylized Geometric "M" Monogram & Synapse Paths -->
  <g filter="url(#neuralGlow)">
    <!-- Left Stalk -->
    <path d="M 64,184 L 64,88 Q 64,74 78,80 L 128,124 L 178,80 Q 192,74 192,88 L 192,184" 
          fill="none" 
          stroke="url(#mindNeuralGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central Neural Core Node -->
    <circle cx="128" cy="124" r="8" fill="#FFFFFF" />
    
    <!-- Top Apex Nodes -->
    <circle cx="76" cy="80" r="6" fill="#38BDF8" />
    <circle cx="180" cy="80" r="6" fill="#C084FC" />

    <!-- Lower Base Nodes -->
    <circle cx="64" cy="184" r="6" fill="#818CF8" />
    <circle cx="192" cy="184" r="6" fill="#A855F7" />

    <!-- Center Bridge Line -->
    <line x1="128" y1="124" x2="128" y2="178" stroke="url(#mindNeuralGrad)" stroke-width="7" stroke-linecap="round" />
    <circle cx="128" cy="178" r="5" fill="#38BDF8" />
  </g>
</svg>
