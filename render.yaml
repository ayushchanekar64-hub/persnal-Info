services:
  - type: web
    name: mind-os-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PROJECT_NAME
        value: MIND OS
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mind-os-db
          property: connectionString

databases:
  - name: mind-os-db
    plan: free
    region: oregon
    databaseName: mindos
    user: mindos_user
